<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar Bay — open-world crime game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e14; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #f2f4f7; }
  #game3d { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  #topbar { position: absolute; top: 14px; right: 18px; text-align: right; }
  #cash { font-size: 30px; font-weight: 800; color: #7be495; text-shadow: 0 2px 6px rgba(0,0,0,.6); }
  #stars { font-size: 26px; letter-spacing: 3px; text-shadow: 0 2px 6px rgba(0,0,0,.6); }
  #healthwrap { position: absolute; left: 18px; bottom: 18px; width: 230px; height: 20px; background: rgba(0,0,0,.55); border: 2px solid rgba(255,255,255,.35); border-radius: 6px; }
  #healthbar { height: 100%; width: 100%; background: #6bcb77; border-radius: 4px; transition: width .15s; }
  #healthtext { position: absolute; right: 6px; top: 0; font-size: 14px; font-weight: 700; line-height: 20px; }
  #weapon { position: absolute; left: 18px; bottom: 46px; font-size: 15px; font-weight: 700; letter-spacing: 1px; text-shadow: 0 1px 4px rgba(0,0,0,.8); }
  #clock { position: absolute; left: 18px; top: 14px; font-size: 16px; font-weight: 700; text-shadow: 0 1px 4px rgba(0,0,0,.8); }
  #banner { position: absolute; top: 16%; width: 100%; text-align: center; opacity: 0; transition: opacity .4s; }
  #banner .btitle { font-size: 44px; font-weight: 900; letter-spacing: 4px; color: #ffc93c; text-shadow: 0 3px 10px rgba(0,0,0,.75); }
  #banner .bsub { font-size: 19px; margin-top: 6px; text-shadow: 0 2px 6px rgba(0,0,0,.8); }
  #objective { position: absolute; top: 64px; width: 100%; text-align: center; font-size: 18px; font-weight: 600; color: #ffe9a0; text-shadow: 0 2px 6px rgba(0,0,0,.85); padding: 0 220px; box-sizing: border-box; }
  #toast { position: absolute; bottom: 120px; width: 100%; text-align: center; font-size: 20px; font-weight: 700; opacity: 0; transition: opacity .3s; text-shadow: 0 2px 6px rgba(0,0,0,.85); }
  #prompt { position: absolute; bottom: 84px; width: 100%; text-align: center; font-size: 17px; color: #aee2ff; opacity: 0; transition: opacity .2s; text-shadow: 0 2px 6px rgba(0,0,0,.85); }
  #minimap { position: absolute; right: 18px; bottom: 18px; width: 180px; height: 180px; border: 2px solid rgba(255,255,255,.4); border-radius: 8px; background: #10151d; }
  #crosshair { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: rgba(255,255,255,.9); box-shadow: 0 0 4px #000; z-index: 6; pointer-events: none; }
  #title, #pause { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(180deg, rgba(8,20,38,.55), rgba(8,10,18,.82)); z-index: 10; text-align: center; }
  #title h1 { font-size: 84px; margin: 0 0 6px; letter-spacing: 10px; font-weight: 900; color: #ffc93c; text-shadow: 0 6px 24px rgba(0,0,0,.8); }
  #title .tag { font-size: 19px; max-width: 560px; margin: 0 0 30px; }
  #title button { pointer-events: auto; font-size: 22px; font-weight: 800; letter-spacing: 2px; padding: 13px 46px; margin: 6px; border: none; border-radius: 8px; background: #ffc93c; color: #221a05; cursor: pointer; }
  #title button:hover { background: #ffd76a; }
  #title .controls, #pause .controls { margin-top: 28px; font-size: 15px; line-height: 1.7; color: #cfd6dd; }
  #pause h2 { font-size: 40px; letter-spacing: 4px; color: #ffc93c; }
  #vignette { position: fixed; inset: 0; pointer-events: none; z-index: 4; box-shadow: inset 0 0 140px rgba(0,0,0,.45); }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="game3d" aria-label="Solmar Bay: explore the city on foot, by car and by boat"></canvas>
<div id="vignette"></div>
<div id="crosshair" style="display:none"></div>
<div id="ui"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
